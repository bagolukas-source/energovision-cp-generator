name: Render CI

on:
  pull_request:   # všetky PR (aj stohované vetvy auditu AOM), nie len do main
  push:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check (AST parse)
        run: |
          python -c "
          import ast, os
          errors = []
          for root, _, files in os.walk('.'):
              if any(x in root for x in ['.git', '__pycache__', 'node_modules', 'analyza_om/__pycache__']):
                  continue
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  p = os.path.join(root, f)
                  try:
                      ast.parse(open(p, encoding='utf-8').read())
                  except SyntaxError as e:
                      errors.append(f'{p}: {e}')
          if errors:
              print('SYNTAX ERRORS:')
              for e in errors: print('  ' + e)
              raise SystemExit(1)
          print(f'OK — všetky .py súbory parsujú')
          "

      - name: Pip install (dry-run dependencies)
        run: |
          pip install --dry-run -r requirements.txt 2>&1 | tail -5 || true

  aom-tests:
    # Výpočtové testy AOM enginu: audit 2026-10-24 vlna 1 + 1b + property testy batérie (t1–t7) + merchant.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip install (výpočtové závislosti, verzie ako v requirements.txt)
        run: |
          pip install numpy==1.26.4 pandas==2.2.0 "pydantic>=2.0" "pyyaml>=6.0" "scipy>=1.10" \
            "numpy-financial>=1.0" highspy==1.11.0 jinja2==3.1.3 matplotlib==3.8.2 python-docx==1.1.2 \
            requests==2.31.0 openpyxl==3.1.2 pytest

      - name: pytest (AOM vlna 1 + audit_bess + merchant)
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENERGO_SPOT_CSV: ${{ github.workspace }}/aom_data/sk_spot_2025_hourly.csv
          ENERGO_TARIFF_YAML: ${{ github.workspace }}/aom_data/tariffs/2026.yaml
        run: python -m pytest -q -p no:cacheprovider tests/test_aom_vlna1.py tests/test_aom_vlna1b_ems.py tests/test_aom_vlna1b_engine.py tests/test_aom_vlna1b_fin.py tests/test_aom_vlna1b_report.py tests/test_audit_bess.py tests/test_aom_merchant_atomic.py tests/test_aom_lp_dispatch.py tests/test_aom_i18n_core.py tests/test_aom_i18n_sk_golden.py tests/test_aom_i18n_catalog.py tests/test_aom_i18n_render.py tests/test_aom_i18n_prezentacia.py tests/test_aom_i18n_financovanie.py tests/test_aom_i18n_porovnanie.py
